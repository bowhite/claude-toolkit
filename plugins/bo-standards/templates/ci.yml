# Generated by the bo-standards `ci-workflow` skill.
#
# The command list below MUST stay identical to what the `pr-check` skill runs
# locally. If they drift, CI stops predicting whether a PR will pass, which is
# the only reason this file exists.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Reads requires-python from pyproject.toml rather than pinning a version
      # here, so bumping the project does not silently leave CI behind.
      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest

  node:
    name: Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `biome ci` is the non-mutating form: it checks formatting and lint
      # together and never writes, which is what a PR gate wants.
      - name: Biome
        run: npx biome ci .
