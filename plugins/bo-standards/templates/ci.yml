# Generated by the bo-standards `ci-workflow` skill.
#
# The command list below MUST stay identical to what the `pr-check` skill runs
# locally. If they drift, CI stops predicting whether a PR will pass, which is
# the only reason this file exists.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the full version on purpose: astral-sh/setup-uv does not
      # publish a floating major tag, so `@v9` does not resolve even though
      # v9.0.0 is the current release. actions/* do publish `@v7` and friends.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # Reads requires-python from pyproject.toml rather than pinning a version
      # here, so bumping the project does not silently leave CI behind.
      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest

  node:
    name: Node
    runs-on: ubuntu-latest
    # package.json is often in a subdirectory (frontend/), not the repo root.
    # Set this to wherever it actually lives; the ci-workflow skill fills it in.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `biome ci` is the non-mutating form: it checks formatting and lint
      # together and never writes, which is what a PR gate wants.
      - name: Biome
        run: ./node_modules/.bin/biome ci .

      # Biome does no type checking at all. Without this a TypeScript project is
      # linted and formatted but never type-checked. Drop this step if the
      # project has no tsconfig.json.
      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history; a shallow clone hides most of it

      # Free for personal accounts (GITLEAKS_LICENSE is only required for
      # organizations). This is the only secret scanning available on private
      # repos, where GitHub's own is behind Advanced Security.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads uv.lock and package-lock.json. Free everywhere with no plan
      # gating, which is why it is here rather than GitHub's dependency-review
      # action -- that one needs Advanced Security on private repos.
      # Full pin: osv-scanner-action publishes no floating major tag, so `@v2`
      # does not resolve. gitleaks-action above does publish `@v3`.
      - uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            --lockfile=./uv.lock
            ./
