# Dependabot version updates.
#
# Free on private repositories as well as public ones -- unlike code scanning,
# secret scanning, and the dependency-review action, which all require Advanced
# Security on a private repo.
#
# Keep `directory` pointing at wherever the manifest actually lives. package.json
# is frequently in `frontend/`, not the repo root.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per week for routine bumps instead of five. Major versions stay
      # separate so they get read properly.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
